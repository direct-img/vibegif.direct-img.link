<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vibegif newsletter · every issue</title>
<link rel="icon" type="image/webp" href="/favicon.webp">
<link rel="canonical" href="https://vibegif.direct-img.link/newsletter/">
<meta name="description" content="every issue of the vibegif newsletter: new sections of free public domain gifs and animated webp">
<script>try{localStorage.bg&&document.documentElement.classList.add("dark")}catch{}</script>
<style>
:root{--bg:#fff;--fg:#000;--mute:#888}
.dark{--bg:#000;--fg:#fff;--mute:#777}
@font-face{font-family:"Stain";src:url("https://cdn.jsdelivr.net/gh/PlanetRenox/StainFont@1.1.0/dist/Stain.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Stain",sans-serif;text-align:center;padding:24px 16px;min-height:100dvh;display:flex;flex-direction:column}
#page{flex:1 0 auto}
h1{font-weight:400;font-size:clamp(22px,5vw,44px);line-height:1.2;margin:8px auto 12px;padding:0 40px}
p{font-size:clamp(16px,3vw,22px);margin-bottom:16px}
a{color:var(--fg)}
ol{list-style:none;padding:0;max-width:640px;margin:32px auto;text-align:left}
li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:3px dashed var(--mute);font-size:clamp(16px,3vw,20px)}
time{color:var(--mute);white-space:nowrap}
#bg{position:absolute;top:16px;right:16px;width:28px;height:28px;padding:0;border:2px solid var(--fg);border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,var(--bg) 50%);cursor:pointer}
#nl{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:420px;margin:48px auto 0}
#nl p,#nl div,#nl output{grid-column:1/-1;margin:0}
#nl input,#nl button{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--fg);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
#nl button{background:var(--fg);color:var(--bg);cursor:pointer}
#nl output{font-size:14px;color:var(--mute)}
footer{margin:40px -16px -24px;padding:5px 0;border-top:.5px solid color-mix(in srgb,var(--mute),transparent 45%);font-size:14px}
footer a{color:var(--mute);text-decoration:none;margin:0 8px}
footer a:hover{color:var(--fg);text-decoration:underline}
</style>
</head>
<body>
<div id="page">
<button id="bg" aria-label="black background" aria-pressed="false"></button>
<h1>vibegif newsletter</h1>
<p><a href="/">back to the gallery</a></p>
<ol>
<!--issues-->
</ol>
<form id="nl">
<p>signup for vibegif newsletter</p>
<input type="email" name="email" required placeholder="you@example.com" aria-label="email">
<button>subscribe</button>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFG4HWETOcDDQ5vg" data-appearance="interaction-only" data-size="flexible"></div>
<output></output>
</form>
</div>
<footer><a href="/faq/">FAQ</a><a href="/privacy/">PRIVACY</a><a href="https://youtu.be/z6F5h7cks3w">YT</a></footer>
<script>
const d=document.documentElement,b=document.getElementById("bg"),sync=()=>b.setAttribute("aria-pressed",d.classList.contains("dark"))
b.onclick=()=>{const v=d.classList.toggle("dark");try{localStorage.bg=v?1:""}catch{}sync()}
sync()
const nl=document.getElementById("nl"),m=nl.querySelector("output"),tk=()=>nl.querySelector("[name=cf-turnstile-response]")?.value
nl.querySelector(".cf-turnstile").dataset.theme=d.classList.contains("dark")?"dark":"light"
nl.onsubmit=async e=>{
  e.preventDefault()
  m.value="subscribing..."
  for(let i=0;i<50&&!tk();i++)await new Promise(r=>setTimeout(r,100))
  try{
    const r=await(await fetch("https://newsletter.planetrenox.com/api/sub",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({pool:"vibegif",email:nl.email.value.trim(),token:tk()||""})})).json()
    m.value=r.ok?"✓ subscribed!":r.error=="captcha failed"?"couldn't verify you're human, try again":r.error||"error"
  }catch{m.value="network error"}
  window.turnstile?.reset()
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script data-goatcounter="https://vibegif.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script async src="https://c.vibegif.direct-img.link/c.js"></script>
</body>
</html>
