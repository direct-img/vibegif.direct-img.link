[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibegif"
version = "0.1.0"
description = "Search the vibegif catalog of tiny animated GIFs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC0-1.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["vibegif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
