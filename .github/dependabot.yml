version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/npm"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directories:
      - "/packages/rust"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directories:
      - "/packages/python"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
