name: "Newsletter: SEND to subscribers (pool vibegif)"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue dir under site/newsletter/ (e.g. issue-2026.11.03). Sends to ALL subscribers."
        required: true
        type: string

permissions:
  contents: read

# Never run two real sends at once
concurrency:
  group: newsletter-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'

      - name: Send to pool "vibegif"
        run: node scripts/send-newsletter.js
        env:
          ISSUE: ${{ inputs.issue }}
          POOL: vibegif
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_SEND_KEY: ${{ secrets.NEWSLETTER_SEND_KEY }}
          NEWSLETTER_FROM: vibegif@planetrenox.com
